<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>위드엠투에스학원</title>
</head>

<body>

    <script>
        const className =
            new URLSearchParams(location.search).get("class") || "math";

        if (className) {
            location.href =
                `./check/check.html?class=${encodeURIComponent(className)}`;
        } else {
            location.href = "./check/check.html";
        }
    </script>

</body>
</html>
