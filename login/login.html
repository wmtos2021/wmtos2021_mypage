<!-- login.html -->

<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>위드엠투에스학원</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="container">

        <div class="academyBrand">
            <img src="../imageLogin/학원명1_투명.webp" class="academyName">
        </div>

        <input
            type="tel"
            id="phoneInput"
            placeholder="휴대전화 번호를 숫자만 입력하세요."
            maxlength="13">

        <button id="loginBtn">
            로그인
        </button>

    </div>


    <!-- 연락처 오류 -->
    <div id="phoneErrorModal" class="modal hidden">

        <div class="errorBox">

            <p id="phoneErrorMessage"></p>

            <button id="phoneErrorOk">
                확인
            </button>

        </div>

    </div>


    <!-- 비밀번호 설정 -->
    <div id="joinModal" class="modal hidden">

        <div class="pwBox">

            <h2>비밀번호 설정</h2>

            <input
                type="password"
                id="newPw"
                placeholder="새 비밀번호 입력">

            <input
                type="password"
                id="newPwCheck"
                placeholder="새 비밀번호 확인">

            <div id="pwError" class="pwError"></div>

            <div class="modalButton">

                <button id="pwOk">
                    확인
                </button>

                <button id="pwCancel">
                    취소
                </button>

            </div>

        </div>

    </div>


    <!-- 비밀번호 확인 -->
    <div id="loginModal" class="modal hidden">

        <div class="pwBox">

            <h2>비밀번호 확인</h2>

            <input
                type="password"
                id="passwordInput"
                placeholder="비밀번호를 입력하세요.">

            <div id="passwordError" class="pwError"></div>

            <div class="modalButton">

                <button id="passwordOk">
                    확인
                </button>

                <button id="passwordCancel">
                    취소
                </button>

            </div>

        </div>

    </div>


    <!-- 하단 구분선 -->
    <div class="footerLine"></div>


    <!-- 하단 왼쪽 정보 -->
    <div class="footerLeft">

        <div class="footerLine1">
            위드엠투에스학원
        </div>

        <div class="footerLine2">
            경남 김해시 활천로 168, 2층
        </div>

    </div>

    <!-- 하단 오른쪽 정보 -->
    <div class="footerRight">
        Ver 2.2.1
    </div>


    <script type="module" src="login.js"></script>

</body>

</html>
